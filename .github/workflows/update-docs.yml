# Blueprint dogfood of the auto-docs pipeline. workflow_dispatch ONLY — no push
# trigger — so it never auto-edits the blueprint's hand-written docs. Verifies
# the classifier + extractor + /update-docs end-to-end when run manually.
name: Update Docs (dogfood)

on:
  workflow_dispatch:
    inputs:
      base_sha:
        description: 'Base SHA to diff from (defaults to HEAD~1)'
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install ast-grep (symbol extraction)
        run: npm install -g @ast-grep/cli

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Classify range
        id: classify
        run: |
          BEFORE="${{ github.event.inputs.base_sha }}"
          if [ -z "$BEFORE" ]; then BEFORE="$(git rev-parse HEAD~1)"; fi
          RANGE="${BEFORE}..${GITHUB_SHA}"
          echo "range=$RANGE" >> "$GITHUB_OUTPUT"
          cp docs-sync/config.example.json docs-sync/config.json
          node scripts/collect-doc-changes.mjs --config docs-sync/config.json --range "$RANGE"

      - name: Generate docs + open draft PR
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/update-docs.sh --range "${{ steps.classify.outputs.range }}"
