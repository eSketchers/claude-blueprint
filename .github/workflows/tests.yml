name: Tests

on:
  pull_request:
  push:
    branches: [master]

jobs:
  unit-and-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dashboard dependencies (ws)
        working-directory: dashboard
        run: npm install --no-audit --no-fund

      - name: Run node --test suite (orchestrator, hooks, dashboard, adopt, bootstrap)
        run: node --test tests/

  adopt-shell-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq

      - name: Run scripts/test-adopt.sh
        run: bash scripts/test-adopt.sh
