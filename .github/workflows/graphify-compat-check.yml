name: Graphify compatibility check

# Weekly check that the latest PyPI graphifyy release still works the way
# scripts/graphify-index.sh assumes. bootstrap.sh pins an exact known-good
# version (see scripts/bootstrap.sh's "graphify" install_tool call) precisely
# so a future graphify release can't silently break adopters — this workflow
# is what actually watches for that, rather than leaving it to be discovered
# by accident (which is how the graphify-index.sh index->update mismatch
# went unnoticed for months; see docs/superpowers/specs/
# 2026-08-26-codebase-audit-and-enhancements.md, HIGH PRIORITY Issue 3).
#
# On failure: opens (or updates, if already open) a tracked issue instead of
# just going red silently. On success: no action needed — a human still
# reviews and bumps the pin deliberately; "the workflow passed" is not the
# same as "someone verified the output is still correct."

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays, 06:00 UTC
  workflow_dispatch: {} # allow manual runs

jobs:
  compat-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install latest graphifyy from PyPI (not the pinned version)
        run: pip install --user graphifyy

      - name: Report installed version
        run: |
          echo "GRAPHIFY_VERSION=$(graphify --version | awk '{print $2}')" >> "$GITHUB_ENV"
          graphify --version

      - name: Run graphify update against this repo
        id: update
        continue-on-error: true
        run: |
          graphify update . 2>&1 | tee /tmp/graphify-output.log

      - name: Verify real output was produced
        id: verify
        if: steps.update.outcome == 'success'
        continue-on-error: true
        run: |
          test -f graphify-out/graph.json
          python3 -c "
          import json
          d = json.load(open('graphify-out/graph.json'))
          assert 'nodes' in d and 'links' in d, 'unexpected graph.json schema'
          assert len(d['nodes']) > 0, 'graph.json has zero nodes'
          print(f\"OK: {len(d['nodes'])} nodes, {len(d['links'])} links\")
          "

      - name: Open/update tracking issue on failure
        if: steps.update.outcome == 'failure' || steps.verify.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="graphify $GRAPHIFY_VERSION breaks compatibility with scripts/graphify-index.sh"
          BODY="The weekly compat-check workflow found that the latest PyPI \`graphifyy\` release (\`$GRAPHIFY_VERSION\`) no longer works the way \`scripts/graphify-index.sh\` (and \`docs/ADVANCED.md\`) assume.

          **The pinned version in \`scripts/bootstrap.sh\` (\`graphifyy==0.9.50\`) is unaffected** — this only means the *next* deliberate upgrade needs investigation before bumping the pin.

          Command output:
          \`\`\`
          $(cat /tmp/graphify-output.log 2>/dev/null | tail -50)
          \`\`\`

          Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          EXISTING=$(gh issue list --search "in:title graphify breaks compatibility" --state open --json number --jq '.[0].number')
          if [[ -n "$EXISTING" ]]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label "bug"
          fi
